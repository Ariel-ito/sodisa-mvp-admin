trigger:
  branches:
    include:
      - main
      - qa
      - staging

pr:
  branches:
    include:
      - main
      - qa
      - staging
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Setup Node.js 22
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: Install dependencies

  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - script: npm run build
      displayName: Build (PR check)
      env:
        NEXT_PUBLIC_API_URL: https://app-sodisa-mvp-api.azurewebsites.net
        NEXT_PUBLIC_BUILD_NUMBER: $(Build.BuildNumber)
        NEXT_PUBLIC_BRANCH: $(Build.SourceBranchName)

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - bash: |
        BRANCH="$(Build.SourceBranchName)"
        if [ "$BRANCH" = "main" ]; then
          echo "##vso[task.setvariable variable=apiUrl]https://app-sodisa-mvp-api.azurewebsites.net"
          echo "##vso[task.setvariable variable=appName]app-sodisa-mvp-admin"
        elif [ "$BRANCH" = "qa" ]; then
          echo "##vso[task.setvariable variable=apiUrl]https://app-sodisa-mvp-api-qa.azurewebsites.net"
          echo "##vso[task.setvariable variable=appName]app-sodisa-mvp-admin-qa"
        else
          echo "##vso[task.setvariable variable=apiUrl]https://app-sodisa-mvp-api-stg.azurewebsites.net"
          echo "##vso[task.setvariable variable=appName]app-sodisa-mvp-admin-stg"
        fi
      displayName: Set target app

    - script: npm run build
      displayName: Build
      env:
        NEXT_PUBLIC_API_URL: $(apiUrl)
        NEXT_PUBLIC_BUILD_NUMBER: $(Build.BuildNumber)
        NEXT_PUBLIC_BRANCH: $(Build.SourceBranchName)

    - script: |
        cp -r public .next/standalone/public
        cp -r .next/static .next/standalone/.next/static
      displayName: Prepare standalone package

    - script: |
        node -e "
          const fs = require('fs');
          const path = '.next/standalone/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = { ...pkg.scripts, start: 'node server.js' };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
        "
      displayName: Patch start script

    - task: AzureWebApp@1
      displayName: Deploy to Azure
      inputs:
        azureSubscription: sodisa-azure-connection
        appType: webAppLinux
        appName: $(appName)
        package: .next/standalone
